project:
  name: example-project

repository:
  path: /workspace/example
  main_branch: main

commands:
  setup:
    - echo "setup"
  test:
    - echo "tests"
  build:
    - echo "build"

limits:
  max_tasks_per_day: 5
  max_runtime_minutes: 90
  max_daily_cost_usd: 5.0
  max_iterations_per_task: 6

permissions:
  read_repository: false
  create_branch: false
  modify_files: false
  run_commands: false
  commit: false
  push_branch: false
  create_pull_request: false
  observe_pull_request: false
  read_issues: false
  autonomous_execution: false
  merge: false
  production_deploy: false
  modify_secrets: false
  destructive_database_changes: false


intake:
  enabled: false
  source: github_issues
  required_labels:
    - fanatic:ready
  blocked_labels:
    - fanatic:blocked
    - fanatic:manual
  max_candidates: 50
  ordering: priority_then_oldest

autonomy:
  enabled: false
  max_tasks_per_run: 1
  auto_promote: false
  auto_deliver: false
  observe_after_delivery: true

scheduler:
  enabled: false
  interval_minutes: 15
  max_consecutive_errors: 3

service:
  enabled: false
  manager: systemd_user
